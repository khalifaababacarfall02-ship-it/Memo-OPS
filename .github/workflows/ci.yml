name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Placeholders: the build only needs the variables to exist.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database:
    name: Database (migrations, RLS, pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The runner image ships PostgreSQL 16; add pgTAP and pg_prove.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - run: bash scripts/db-test.sh --local --quiet
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
